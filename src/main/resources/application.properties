# ==========================================
# APPLICATION
# ==========================================

spring.application.name=fraud-starter
server.port=8080


# ==========================================
# POSTGRESQL DATABASE
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/frauddb
spring.datasource.username=frauduser
spring.datasource.password=fraudpass123
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# HIKARI CONNECTION POOL
# ==========================================

spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false


# ==========================================
# KAFKA
# ==========================================

spring.kafka.bootstrap-servers=localhost:9092


# ==========================================
# KAFKA CONSUMER
# ==========================================

spring.kafka.consumer.group-id=fraud-detection-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


# ==========================================
# KAFKA PRODUCER
# ==========================================

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.data.redis.host=localhost
spring.data.redis.port=6379
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.prometheus.access=unrestricted